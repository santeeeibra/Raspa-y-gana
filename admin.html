<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Accesos directos · Las Vegas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{--night:#07090f;--steel:#141925;--line:rgba(255,255,255,.09);--blue:#2456c2;--red:#e3262a;--white:#f4f6fa;--muted:#8c95ab;
  --f-head:"Bebas Neue",Impact,sans-serif;--f-body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(45% 55% at -5% 40%,rgba(36,86,194,.28),transparent 70%),radial-gradient(45% 55% at 105% 40%,rgba(227,38,42,.22),transparent 70%),var(--night);
  color:var(--white);font-family:var(--f-body);padding:24px max(16px,env(safe-area-inset-left,0px)) 40px}
main{max-width:460px;margin:0 auto;display:grid;gap:12px;text-align:center}
h1{font-family:var(--f-head);font-weight:400;font-size:44px;letter-spacing:.06em;margin:0}
p{margin:0 0 6px;color:#c3c9d6;font-size:18px}
a.card,button.card{display:grid;gap:2px;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--steel);color:var(--white);text-decoration:none;font:inherit;cursor:pointer;text-align:center}
.card b{font-family:var(--f-head);font-weight:400;font-size:30px;letter-spacing:.06em}
.card span{color:var(--muted);font-size:16px}
.card.main{border-color:#1fa855}
.out{background:none;border:0;color:var(--muted);font:500 16px var(--f-body);text-decoration:underline;cursor:pointer;margin-top:8px}
.volver{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:50;display:inline-block;padding:8px 14px;border-radius:99px;background:rgba(20,25,37,.85);border:1px solid rgba(255,255,255,.14);color:#f4f6fa;text-decoration:none;font:700 15px "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(6px)}
</style>
</head>
<body>
<a class="volver" href="index.html">← Inicio</a>
<main>
  <h1>Accesos directos</h1>
  <p>Panel del local</p>
  <a class="card main" href="canjear.html"><b>Canjear tickets</b><span>Buscar un código y marcarlo como canjeado</span></a>
  <button class="card" id="probar" type="button"><b>Probar mi ticket</b><span>Modo prueba: ticket nuevo cada vez, sin límites</span></button>
  <button class="card" id="gift" type="button"><b id="giftT">Tanda de regalo: ...</b><span id="giftS">Cargando estado</span></button>
  <a class="card" href="guia.html"><b>Guía de cortes</b><span>Descubrí tu corte ideal</span></a>
  <a class="card" href="juegos.html"><b>Juegos</b><span>Cabezones y Las Vegas Tycoon</span></a>
  <button class="out" id="salir" type="button">Cerrar sesión</button>
</main>
<script>
// Solo se llega logueándose desde el acceso del local en la página principal (la clave se verifica en el servidor)
let ok=false;try{ok=!!sessionStorage.getItem("lv-pin")}catch(e){}
if(!ok)location.replace("index.html");

const SB="https://fabakotfzxbwyqztrkoy.supabase.co",SBK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhYmFrb3Rmenhid3lxenRya295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDI4MzMsImV4cCI6MjEwNzg3ODgzM30.Zdr8kOdavJeyNQmBHILH0Q2i9oH2Y6OgUlKJPPkmWyw";
const PIN=sessionStorage.getItem("lv-pin")||"";
const gift=document.getElementById("gift");let giftOn=null;
function giftShow(){document.getElementById("giftT").textContent="Tanda de regalo: "+(giftOn?"ENCENDIDA":"APAGADA");
  document.getElementById("giftS").textContent=giftOn?"Todos los tickets nuevos salen 15%, sin corte gratis. Tocá para apagar":"Sorteo normal. Tocá para encender la tanda de 15%";
  gift.style.borderColor=giftOn?"#1fa855":"var(--line)"}
async function giftRpc(fn,body){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SBK,Authorization:"Bearer "+SBK,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||"error");return j}
giftRpc("staff_get_gift",{p_pin:PIN}).then(j=>{giftOn=j.gift;giftShow()}).catch(()=>{document.getElementById("giftS").textContent="No se pudo leer el estado"});
gift.onclick=async()=>{if(giftOn===null)return;const nuevo=!giftOn;
  if(!confirm(nuevo?"¿Encender la tanda de regalo (todos 15%)?":"¿Apagar la tanda de regalo y volver al sorteo normal?"))return;
  try{const j=await giftRpc("staff_set_gift",{p_pin:PIN,p_on:nuevo});giftOn=j.gift;giftShow()}catch(e){alert("No se pudo cambiar: "+e.message)}};
document.getElementById("probar").onclick=()=>{try{sessionStorage.setItem("lv-test","1");sessionStorage.removeItem("lv-keep")}catch(e){}location.href="index.html"};
document.getElementById("salir").onclick=()=>{try{sessionStorage.removeItem("lv-pin");sessionStorage.removeItem("lv-test");sessionStorage.removeItem("lv-keep");localStorage.removeItem("lv-raspa-v2")}catch(e){}location.href="index.html"};
</script>
</body>
</html>
