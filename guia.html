<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu Corte Ideal | Las Vegas</title>
<meta name="description" content="Respondé 4 preguntas y descubrí el corte que mejor te queda. Las Vegas Barbería.">
<meta property="og:title" content="Encontrá tu corte ideal">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Bebas+Neue&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Mismo estilo que el ticket: barbería urbana premium, luz azul/roja del logo */
:root{
  --night:#07090f; --steel:#141925; --line:rgba(255,255,255,.09); --blue:#2456c2; --red:#e3262a; --white:#f4f6fa; --gold:#ffc83d; --muted:#8c95ab;
  --f-tag:"Permanent Marker",cursive;
  --f-head:"Bebas Neue",Impact,sans-serif;
  --f-body:"Barlow Condensed",system-ui,sans-serif;
  --split:linear-gradient(90deg,var(--blue) 0 50%,var(--red) 50% 100%);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(45% 40% at 0 20%,color-mix(in srgb,var(--blue) 25%,transparent),transparent 70%),
  radial-gradient(45% 40% at 100% 20%,color-mix(in srgb,var(--red) 20%,transparent),transparent 70%),var(--night);background-attachment:fixed;
  color:var(--white);font-family:var(--f-body);font-size:19px;min-height:100vh;padding:28px 16px 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
header{text-align:center;margin-bottom:22px}
header img{width:84px;border-radius:50%;box-shadow:0 0 0 2px var(--night),0 0 0 3.5px rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.6)}
@font-face{font-family:"Mostwasted";src:url(fonts/Mostwasted.ttf) format("truetype");font-display:swap}
h1{font-family:"Mostwasted",var(--f-head);font-weight:400;letter-spacing:0 !important;font-size:clamp(32px,9.5vw,44px);letter-spacing:.05em;line-height:1;margin-top:14px}
h1 span{font-family:var(--f-tag);font-size:.72em;white-space:nowrap;letter-spacing:0;color:var(--white)}
h1::after{content:"";display:block;width:56px;height:3px;margin:12px auto 0;border-radius:2px;background:var(--split)}
.sub{color:var(--muted);font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin-top:10px}
.bar{height:4px;background:var(--steel);border-radius:2px;margin:18px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--split);background-size:560px 100%;transition:width .35s}
h2{font-family:var(--f-head);font-weight:400;font-size:32px;letter-spacing:.03em;margin-bottom:14px}
.opts{display:grid;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{background:var(--steel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:flex;gap:14px;align-items:center;transition:border-color .2s,transform .15s}
.opt:hover,.opt:focus-visible{border-color:rgba(255,255,255,.35);outline:none}
.opt:active{transform:scale(.98)}
.opt b{display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:12px;background:rgba(255,255,255,.05);color:var(--white)}
.opt small{display:block;color:var(--muted)}
.back{background:none;border:0;color:var(--muted);margin-top:18px;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.card{background:var(--steel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.card.top{background:linear-gradient(var(--steel),var(--steel)) padding-box,var(--split) border-box;border-color:transparent}
.card.top::before{display:none}
.card h3{font-family:var(--f-head);font-weight:400;font-size:28px;letter-spacing:.03em}
.card p{color:#c3c9d6}
.foto{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;margin-bottom:12px;background:var(--night)}
.tag{font-family:var(--f-tag);color:var(--gold);font-size:15px}
.cta{display:block;text-align:center;text-decoration:none;font-family:var(--f-head);font-size:24px;letter-spacing:.08em;padding:14px;border-radius:99px;margin-top:12px;color:#fff;transition:transform .15s}
.cta:active{transform:scale(.97)}
.wa{background:#1fa855}
.gift{background:linear-gradient(var(--night),var(--night)) padding-box,var(--split) border-box;border:1.5px solid transparent}
.volver{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:50;display:inline-block;padding:8px 14px;border-radius:99px;background:rgba(20,25,37,.85);border:1px solid rgba(255,255,255,.14);color:#f4f6fa;text-decoration:none;font:700 15px "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(6px)}
.fotos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px;border-radius:12px}
.fotos:empty{display:none}
.fotos .foto{flex:0 0 100%;margin:0;scroll-snap-align:start}
.local{display:block;margin:14px auto 0;background:none;border:1px dashed rgba(255,255,255,.3);border-radius:99px;padding:8px 16px;color:var(--gold);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.drop{border:2px dashed rgba(255,255,255,.25);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:16px;cursor:pointer;margin-top:10px}
.drop.on{border-color:var(--gold);color:var(--gold)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative;width:72px;height:90px}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:14px;line-height:1;padding:0}
.scan{display:block;width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1px dashed rgba(255,255,255,.3);background:none;color:var(--gold);font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.cam .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.estado{text-align:center;font-size:20px;margin:10px 0 0;color:var(--gold);min-height:28px}.estado.ok{color:#3ddc84}
.res{background:var(--steel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;text-align:center}
.res b{font-family:var(--f-head);font-weight:400;font-size:30px;letter-spacing:.04em;color:var(--gold)}
.res .cta{margin-top:10px}
h2{font-family:"Mostwasted",var(--f-head);letter-spacing:0;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.promo{position:relative;margin-top:16px;padding:22px 16px 16px;border-radius:6px;text-align:center;overflow:hidden;
  background:linear-gradient(var(--steel),#0d111a) padding-box,var(--split) border-box;border:1.5px solid transparent}
.promo::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(-45deg,var(--red) 0 8px,var(--white) 8px 16px,var(--blue) 16px 24px,var(--white) 24px 32px)}
.promo .precio{font-family:"Mostwasted",var(--f-head);font-size:44px;line-height:1;color:var(--gold);transform:rotate(-2deg);text-shadow:3px 3px 0 rgba(0,0,0,.6)}
.promo .precio small{display:block;font-family:var(--f-head);font-size:16px;letter-spacing:.2em;color:var(--muted);margin-bottom:4px;transform:none}
.promo .amigo{margin:14px 0 10px;padding:10px;border:2px solid var(--gold);border-radius:4px;transform:rotate(-1deg);box-shadow:4px 4px 0 rgba(255,200,61,.25);font-size:17px}
.promo .amigo b{font-family:var(--f-head);font-weight:400;font-size:24px;letter-spacing:.04em;color:var(--gold);display:block}
.promo .reloj{display:inline-block;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:1px dashed rgba(255,255,255,.2);padding-top:10px;margin-top:4px}
.promo .reloj b{color:var(--white)}
</style>
</head>
<body>

<script>
const ICON={"🥚": "<ellipse cx=\"12\" cy=\"12\" rx=\"6.5\" ry=\"8.5\"/>", "🟠": "<circle cx=\"12\" cy=\"12\" r=\"8\"/>", "🟥": "<rect x=\"4.5\" y=\"4.5\" width=\"15\" height=\"15\" rx=\"3\"/>", "📏": "<ellipse cx=\"12\" cy=\"12\" rx=\"5\" ry=\"9.5\"/>", "🔻": "<path d=\"M4 5h16l-6.5 13.5a1.7 1.7 0 0 1-3 0z\"/>", "〰️": "<path d=\"M7 3v18M12 3v18M17 3v18\"/>", "🌊": "<path d=\"M3 8c3-3 6 3 9 0s6-3 9 0M3 16c3-3 6 3 9 0s6-3 9 0\"/>", "🌀": "<path d=\"M12 12a1.5 1.5 0 1 1 1.5 1.5A3.5 3.5 0 0 1 10 10a5 5 0 0 1 5-5 6.5 6.5 0 0 1 6.5 6.5A8 8 0 0 1 13.5 19.5 9 9 0 0 1 3 11\"/>", "🧢": "<path d=\"M5 20v-8a7 7 0 0 1 14 0v8\"/><path d=\"M8 8l1 2M12 6v2.5M16 8l-1 2\" stroke-dasharray=\"1 2\"/>", "👔": "<path d=\"M9 3h6l-1.5 3 2 11L12 21l-3.5-4 2-11z\"/><path d=\"M10.5 6h3\"/>", "🔥": "<path d=\"M12 21a6 6 0 0 0 6-6c0-4-3-6-4-10-1 3-3 4-3 4s-1-1-1-3c-2 2-4 5-4 9a6 6 0 0 0 6 6z\"/>", "⚡": "<path d=\"M13 2 4 14h7l-1 8 9-12h-7z\"/>", "🎩": "<path d=\"M7 17V6a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v11M3 17h18M7 13h10\"/>", "⏱️": "<circle cx=\"12\" cy=\"13\" r=\"8\"/><path d=\"M12 9v4l2.5 2.5M10 2h4\"/>", "🪮": "<path d=\"M3 8h18v3H3zM5 11v8M8 11v8M11 11v8M14 11v8M17 11v8M20 11v8\"/>", "💈": "<circle cx=\"6\" cy=\"6\" r=\"3\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M8.5 7.5 20 18M8.5 16.5 20 6\"/>"};
const svg=k=>`<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||""}</svg>`;
// CAMBIAR: tu número de WhatsApp con código de país, sin + ni espacios (ej: 5491112345678)
const WHATSAPP = "5492920605208";
const PRECIO = "$18.000";

const PREGUNTAS = [
  {id:"rostro", t:"¿Qué forma tiene tu cara?", o:[
    ["ovalado","🥚","Ovalada","Frente un poco más ancha que el mentón"],
    ["redondo","🟠","Redonda","Ancho y largo parecidos, mejillas llenas"],
    ["cuadrado","🟥","Cuadrada","Mandíbula marcada y recta"],
    ["alargado","📏","Alargada","Bastante más larga que ancha"],
    ["triangular","🔻","Corazón / diamante","Mentón fino, pómulos o frente anchos"]]},
  {id:"pelo", t:"¿Cómo es tu pelo?", o:[
    ["lacio","〰️","Lacio",""],["ondulado","🌊","Ondulado",""],["rulo","🌀","Rulos / afro",""],["poco","🧢","Fino o con entradas",""]]},
  {id:"objetivo", t:"¿Qué buscás?", o:[
    ["prolijo","👔","Look prolijo","Trabajo, eventos"],["moda","🔥","A la moda","Lo que se usa ahora"],["juvenil","⚡","Atrevido","Que llame la atención"],["clasico","🎩","Clásico","Que nunca pase de moda"]]},
  {id:"mant", t:"¿Cuánto tiempo le dedicás al peinado?", o:[
    ["nada","⏱️","Nada","Me levanto y salgo"],["poco","🪮","5 minutos","Un poco de cera"],["mucho","💈","Lo que haga falta","Me encanta peinarme"]]}
];

// Cada corte suma puntos según las respuestas
const CORTES = [
  {n:"Low Fade + Texturizado", d:"Degradado bajo con arriba texturizado y desordenado. Moderno y fácil.",
   p:{ovalado:2,redondo:2,cuadrado:2,triangular:1,lacio:2,ondulado:2,moda:3,juvenil:1,poco:2,nada:1}},
  {n:"Mid Fade + Crop francés", d:"Flequillo corto y prolijo hacia adelante, con la parte de arriba más lisa. Disimula entradas y frentes amplias.",
   p:{ovalado:2,redondo:1,cuadrado:2,alargado:2,triangular:2,lacio:2,poco:3,moda:2,nada:3}},
  {n:"Pompadour / Quiff", d:"Volumen arriba peinado hacia atrás y costados cortos. Suma altura: ideal para caras redondas o cuadradas.",
   p:{redondo:3,cuadrado:2,ovalado:2,triangular:1,lacio:2,ondulado:2,prolijo:2,juvenil:2,mucho:3}},
  {n:"Side Part clásico", d:"Raya al costado con tijera. Elegante, ideal para el trabajo.",
   p:{ovalado:2,cuadrado:3,redondo:2,triangular:2,lacio:3,ondulado:1,prolijo:3,clasico:3,poco:2}},
  {n:"Buzz Cut / Rapado con fade", d:"Máquina pareja con degradado. Cero mantenimiento, resalta la simetría y los rasgos.",
   p:{ovalado:3,cuadrado:3,poco:3,rulo:1,nada:3,juvenil:1,clasico:1}},
  {n:"Taper + Rulos definidos", d:"Costados limpios en degradado y rulos con volumen arriba.",
   p:{rulo:4,ondulado:2,ovalado:2,redondo:1,alargado:1,moda:2,juvenil:2,poco:1,nada:1}},
  {n:"Mullet moderno", d:"Corto adelante y a los costados, largo atrás. Para animarse.",
   p:{ondulado:2,rulo:2,lacio:1,ovalado:2,triangular:1,alargado:1,juvenil:4,moda:1,poco:1}},
  {n:"Corte medio con flequillo lateral", d:"Más largo en los costados: equilibra caras alargadas.",
   p:{alargado:4,triangular:2,lacio:2,ondulado:2,clasico:1,moda:1,poco:2,prolijo:1}},
  {n:"Ivy League", d:"Versión más larga del crew cut: alcanza para raya al costado o peinado hacia atrás. Prolijo y clásico.",
   p:{cuadrado:2,ovalado:2,alargado:1,lacio:2,poco:1,prolijo:3,clasico:2,nada:2,}},
  {n:"Fade + Barba perfilada", d:"Degradado con barba perfilada, que suma volumen en la mandíbula. Va bien en caras redondas o de mentón fino.",
   p:{redondo:3,triangular:3,alargado:1,moda:2,prolijo:1,poco:2,lacio:1,rulo:1}},
  {n:"Textured Crop", d:"Corto y desflecado arriba con flequillo hacia adelante. Muy de moda y fácil de peinar.",
   p:{ovalado:2,redondo:2,cuadrado:2,triangular:2,lacio:3,ondulado:2,moda:3,juvenil:2,poco:3,nada:2}},
  {n:"Crew Cut", d:"Corto arriba (se peina hacia arriba) y degradado a los costados. Clásico, práctico y siempre prolijo.",
   p:{ovalado:2,cuadrado:3,lacio:2,prolijo:3,clasico:3,poco:3,nada:3}},
  {n:"Undercut", d:"Costados muy cortos y arriba largo, con contraste marcado. Para peinar hacia atrás o al costado.",
   p:{ovalado:2,cuadrado:2,redondo:2,alargado:1,lacio:3,ondulado:2,moda:3,juvenil:2,mucho:3}},
  {n:"Slick Back", d:"Peinado hacia atrás con degradado. Look elegante y con personalidad.",
   p:{ovalado:2,cuadrado:3,triangular:2,lacio:3,ondulado:1,prolijo:2,clasico:2,moda:2,mucho:2}},
  {n:"Caesar", d:"Corto y parejo con flequillo recto y corto. Simple, sin textura; ideal para disimular entradas.",
   p:{ovalado:2,redondo:1,cuadrado:2,alargado:2,lacio:2,ondulado:2,poco:3,nada:3,clasico:1}}
];

// Modelo entrenado (modelo.json, lo genera entrenar.py). Si no carga, se usa la tabla CORTES de arriba.
let MODELO = null, TEXTOS = {};
const AZAR = 0.5; // sacude un poco los puntajes para que no salga siempre lo mismo
function aplicarTextos(){ CORTES.forEach(c => { const t = TEXTOS[c.n]; if (t) { if (t.nombre) c.nombre = t.nombre; if (t.descripcion) c.d = t.descripcion } }); }
fetch("modelo.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : Promise.reject()).then(m => {
  if (!m || !m.cortes || !Object.keys(m.cortes).length) return;
  Object.keys(m.cortes).forEach(n => { if (!CORTES.some(c => c.n === n)) CORTES.push({n, d:"", p:{}}); });
  MODELO = m; aplicarTextos();
}).catch(() => {});

// Foto de cada corte: imagenes/cortes/<nombre-sin-tildes-con-guiones>.jpg
const foto = n => "imagenes/cortes/" + n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + ".jpg";

const app = document.getElementById("app");
const bar = document.getElementById("bar");
let paso = 0, resp = {};

function pregunta(){
  const q = PREGUNTAS[paso];
  bar.style.width = (paso / PREGUNTAS.length * 100) + "%";
  app.innerHTML = `<h2>${q.t}</h2><div class="opts">` +
    q.o.map(([v,e,l,s]) => `<button class="opt" data-v="${v}"><b>${svg(e)}</b><span>${l}${s?`<small>${s}</small>`:""}</span></button>`).join("") +
    `</div>` + (paso ? `<button class="back">← Volver</button>` : "");
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { resp[q.id] = b.dataset.v; paso++; paso < PREGUNTAS.length ? pregunta() : resultado(); });
  const back = app.querySelector(".back"); if (back) back.onclick = () => { paso--; pregunta(); };
  if (q.id === "rostro") { app.insertAdjacentHTML("beforeend", `<button class="scan">📷 No sé mi forma de rostro · escanear con la cámara</button>`); app.querySelector(".scan").onclick = escanear; }
}

function resultado(){
  bar.style.width = "100%";
  const vals = Object.values(resp);
  const puntaje = MODELO
    ? c => { const m = MODELO.cortes[c.n]; return m ? m.intercepto + Object.entries(resp).reduce((a,[k,v]) => a + (m.pesos[k+"="+v]||0), 0) + Math.random()*AZAR : -Infinity }
    : c => vals.reduce((a,v) => a + (c.p[v]||0), 0);
  const top = CORTES.map(c => ({...c, s: puntaje(c)}))
                    .sort((a,b) => b.s - a.s).slice(0,3);
  const msg = `Hola! Hice el test en la web y me recomendó: *${top[0].nombre||top[0].n}*. Quiero reservar turno (sé que es con 2 horas de anticipación mínimo)`;
  app.innerHTML = `<h2>Tus cortes recomendados</h2>` +
    top.map((c,i) => `<div class="card ${i?"":"top"}">${i?"":`<span class="tag">★ Tu mejor opción</span>`}<div class="fotos" data-c="${c.n}" data-t="${c.nombre||c.n}"></div><h3>${c.nombre||c.n}</h3><p>${c.d}</p></div>`).join("") +
    `<div class="promo"><div class="precio"><small>Tu corte</small>${PRECIO}</div>
     <p class="sub">Incluye ticket <b>Raspá y Ganá</b> de regalo</p>
     <a class="cta wa" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Reservar por WhatsApp</a>
     <div class="amigo"><b>👥 Traé un amigo</b>2 cortes por $32.000 · $16.000 c/u</div>
     <span class="reloj">⏰ Turnos con <b>2 hs de anticipación</b> mínimo</span></div>
     <a class="cta gift" href="index.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:8px"><rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M3 12h18M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zm0 0s2-5 4.5-3.5S15 8 12 8z"/></svg>Raspá y ganá tu premio</a>
     <button class="back">Volver a empezar</button>`;
  app.querySelector(".back").onclick = () => { paso = 0; resp = {}; pregunta(); };
  app.querySelectorAll(".fotos").forEach(async d => {
    const c = d.dataset.c, f = await fotosDe(c);
    d.innerHTML = f.length ? f.map(x => `<img class="foto" src="${x.img}" alt="${c}">`).join("")
                           : `<img class="foto" src="${foto(c)}" alt="${c}" loading="lazy" onerror="this.remove()">`;
  });
}

// ---- Fotos de cortes (guardadas en Supabase; solo el local con PIN puede subir/borrar) ----
const SB="https://fabakotfzxbwyqztrkoy.supabase.co", SBK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhYmFrb3Rmenhid3lxenRya295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDI4MzMsImV4cCI6MjEwNzg3ODgzM30.Zdr8kOdavJeyNQmBHILH0Q2i9oH2Y6OgUlKJPPkmWyw";
async function rpc(fn, body){
  const r = await fetch(SB+"/rest/v1/rpc/"+fn, {method:"POST", headers:{apikey:SBK, Authorization:"Bearer "+SBK, "Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json(); if (!r.ok || (j && j.error)) throw new Error((j && (j.error || j.message)) || r.status); return j;
}
const cache = {};
const fotosDe = async n => { if (cache[n]) return cache[n]; try { return cache[n] = await rpc("get_corte_fotos", {p_corte:n}) } catch(e) { return [] } };
// ---- Escáner de rostro (corre en el celular: la foto no se envía ni se guarda) ----
const FORMA = {ovalado:"Ovalada", redondo:"Redonda", cuadrado:"Cuadrada", alargado:"Alargada", triangular:"Corazón / diamante"};
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
let landmarker = null, stream = null;
async function cargarModelo(){
  if (landmarker) return landmarker;
  const m = await import(MP + "/+esm"), fs = await m.FilesetResolver.forVisionTasks(MP + "/wasm");
  return landmarker = await m.FaceLandmarker.createFromOptions(fs, {
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
    runningMode:"VIDEO", numFaces:1});
}
// Mide proporciones con los puntos de la cara y elige la forma más cercana
function clasificar(p, w, h){
  const d = (a, b) => Math.hypot((p[a].x-p[b].x)*w, (p[a].y-p[b].y)*h);
  const ancho = d(234, 454), mand = d(132, 361)/ancho, frente = d(103, 332)/ancho, largo = d(10, 152)/ancho;
  const giro = Math.abs(d(1, 234) - d(1, 454)) / (d(1, 234) + d(1, 454));
  let f;
  if (largo >= 1.48) f = "alargado";
  else if (mand < .8 && frente / mand > 1.2) f = "triangular";
  else if (largo < 1.32) f = mand >= .88 ? "cuadrado" : "redondo";
  else if (mand >= .9) f = "cuadrado";
  else if (frente / mand > 1.25) f = "triangular";
  else f = "ovalado";
  return {f, giro};
}
let camOn = false;
function cerrarCam(){ camOn = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
const med = (p, a, b) => ({x:(p[a].x+p[b].x)/2, y:(p[a].y+p[b].y)/2});
async function escanear(){
  app.innerHTML = `<h2>Escanear rostro</h2><p class="sub" style="margin:-6px 0 10px">Mirá de frente, con buena luz y el pelo apartado de la frente.</p>
    <div class="cam"><video playsinline muted></video><canvas class="ov"></canvas></div>
    <p class="estado" id="estado">Iniciando cámara…</p>
    <button class="cta wa" id="cap" disabled>Capturar ahora</button><button class="back">← Volver</button>`;
  const cam = app.querySelector(".cam"), vid = cam.querySelector("video"), cv = cam.querySelector("canvas"), cap = app.querySelector("#cap"), est = app.querySelector("#estado");
  app.querySelector(".back").onclick = () => { cerrarCam(); pregunta(); };
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:{ideal:720}}, audio:false}); vid.srcObject = stream; await vid.play(); }
  catch(e) { cerrarCam(); cam.outerHTML = `<p class="res">No se pudo usar la cámara (${e.name||"error"}). Revisá el permiso del navegador o elegí tu forma a mano.</p>`; cap.remove(); est.remove(); return; }
  try { est.textContent = "Cargando detector…"; await cargarModelo(); }
  catch(e) { cerrarCam(); cam.outerHTML = `<p class="res">No se pudo cargar el detector de rostro. Revisá tu conexión e intentá de nuevo, o elegí tu forma a mano.</p>`; cap.remove(); est.remove(); return; }

  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;

    const {f, giro} = clasificar(ultimo.p, vid.videoWidth, vid.videoHeight);
    cerrarCam();
    app.innerHTML = `<h2>Tu rostro</h2><div class="res"><p>Parece que tenés cara</p><b>${FORMA[f]}</b>
      <p class="sub" style="margin-top:8px">Es una estimación por la cámara.</p>
      <button class="cta wa" id="usar">Usar este resultado</button><button class="back" id="otra">Elegir otra forma a mano</button><button class="back" id="re">Volver a escanear</button></div>`;
    app.querySelector("#usar").onclick = () => { resp.rostro = f; paso = 1; pregunta(); };
    app.querySelector("#otra").onclick = () => pregunta();
    app.querySelector("#re").onclick = escanear;
  };
  cap.onclick = () => { if (!ultimo) { est.textContent = "No veo tu cara todavía. Acercate y mirá de frente."; return } finalizar(); };
  (function loop(){
    if (!camOn) return;
    const cw = cam.clientWidth, ch = cam.clientHeight;
    if (cv.width !== Math.round(cw*dpr) || cv.height !== Math.round(ch*dpr)) { cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cw, ch);
    const vw = vid.videoWidth, vh = vid.videoHeight;
    if (vw && vid.currentTime !== lastT) {
      lastT = vid.currentTime;
      if (frm.width !== vw || frm.height !== vh) { frm.width = vw; frm.height = vh; }

    const X = q => cw - (q.x*vw*s + ox), Y = q => q.y*vh*s + oy;   // espejado, igual que el video
    if (ultimo) {
      const p = ultimo.p, top = med(p,10,10), chin = p[152], eyeL = med(p,33,133), eyeR = med(p,362,263), nose = p[1], mouth = med(p,13,14);
      const fx = (X(p[234]) + X(p[454]))/2, fy = (Y(top) + Y(chin))/2, alto = Math.abs(Y(chin) - Y(top));
      const tilt = Math.atan2(Y(eyeR) - Y(eyeL), X(eyeR) - X(eyeL)) * 180/Math.PI;
      const {giro} = clasificar(p, vw, vh);
      if (alto < ry*2*.62) msg = "Acercate un poco";
      else if (alto > ry*2*1.05) msg = "Alejate un poco";
      else if (fx < dx - cw*.06) msg = "Movete a la derecha";
      else if (fx > dx + cw*.06) msg = "Movete a la izquierda";
      else if (fy < cy - ch*.07) msg = "Bajá un poco el celu";
      else if (fy > cy + ch*.07) msg = "Subí un poco el celu";
      else if (Math.abs(Math.abs(tilt) > 90 ? 180 - Math.abs(tilt) : tilt) > 6) msg = "Enderezá la cabeza";
      else if (giro > .12) msg = "Mirá de frente a la cámara";
      else { ok = true; msg = "¡Perfecto! No te muevas…"; }
      // puntos detectados
      ctx.fillStyle = ok ? "#1fa855" : "#ffc83d";
      [eyeL, eyeR, nose, mouth, chin].forEach(q => { ctx.beginPath(); ctx.arc(X(q), Y(q), 4, 0, 7); ctx.fill(); });
      ctx.strokeStyle = ok ? "rgba(31,168,85,.9)" : "rgba(255,200,61,.8)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X(eyeL), Y(eyeL)); ctx.lineTo(X(eyeR), Y(eyeR)); ctx.moveTo(X(nose) - 40, Y(nose)); ctx.lineTo(X(nose) + 40, Y(nose)); ctx.moveTo(X(mouth) - 28, Y(mouth)); ctx.lineTo(X(mouth) + 28, Y(mouth)); ctx.stroke();
    }
    ctx.lineWidth = 2; ctx.strokeStyle = ok ? "#1fa855" : "rgba(255,255,255,.65)";
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.stroke();
    ctx.setLineDash([6, 6]); ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy - ry); ctx.lineTo(cx, cy + ry);                                   // eje central
    [[-.30], [.02], [.22]].forEach(([k]) => { const y = cy + ry*k; ctx.moveTo(cx - rx*.7, y); ctx.lineTo(cx + rx*.7, y) }); // ojos, nariz, boca
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.font = "13px sans-serif"; ctx.textAlign = "left";
    [["ojos", -.30], ["nariz", .02], ["boca", .22]].forEach(([t, k]) => ctx.fillText(t, cx + rx*.72, cy + ry*k + 4));
    est.textContent = msg; est.classList.toggle("ok", ok);
    if (ok) { okDesde = okDesde || performance.now(); if (performance.now() - okDesde > 1200) { finalizar(); return } } else okDesde = 0;
    requestAnimationFrame(loop);
  })();
}
