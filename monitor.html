<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Monitor de tickets · Las Vegas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{--night:#07090f;--steel:#141925;--line:rgba(255,255,255,.09);--blue:#2456c2;--red:#e3262a;--white:#f4f6fa;--gold:#ffc83d;--muted:#8c95ab;--ok:#1fa855;
  --f-head:"Bebas Neue",Impact,sans-serif;--f-body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(45% 55% at -5% 40%,rgba(36,86,194,.28),transparent 70%),radial-gradient(45% 55% at 105% 40%,rgba(227,38,42,.22),transparent 70%),var(--night);
  color:var(--white);font-family:var(--f-body);padding:24px max(16px,env(safe-area-inset-left,0px)) 40px}
main{max-width:460px;margin:0 auto;display:grid;gap:14px;text-align:center}
@font-face{font-family:"Mostwasted";src:url(fonts/Mostwasted.ttf) format("truetype");font-display:swap}
h1{font-family:"Mostwasted",var(--f-head);font-weight:400;letter-spacing:0 !important;font-size:44px;letter-spacing:.06em;margin:0}
p{margin:0;color:#c3c9d6;font-size:18px}
form{display:grid;gap:12px}
input{font:inherit;font-size:24px;text-align:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--steel);color:var(--white);letter-spacing:.12em;text-transform:uppercase}
input[type=password]{text-transform:none}
button{font-family:var(--f-head);font-size:26px;letter-spacing:.08em;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
button.go{background:var(--ok)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:20px}
.card{background:var(--steel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:8px}
.card .big{font-family:var(--f-head);font-size:48px;color:var(--gold);line-height:1}
.card .code{font-family:var(--f-head);font-size:28px;letter-spacing:.14em}
.msg{font-size:20px}.err{color:#ff6b6b}.ok{color:var(--ok)}
.bono{border:1px dashed var(--gold);border-radius:12px;padding:8px;color:var(--gold)}
.volver{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:50;display:inline-block;padding:8px 14px;border-radius:99px;background:rgba(20,25,37,.85);border:1px solid rgba(255,255,255,.14);color:#f4f6fa;text-decoration:none;font:700 15px "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(6px)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--steel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-head);font-weight:400;font-size:44px;line-height:1;color:var(--gold)}
.stat span{color:var(--muted);font-size:16px}
.list{display:grid;gap:8px;text-align:left}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--steel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.row .t{white-space:nowrap;color:var(--muted);font-size:16px;grid-row:1/3}
.row a.ph{color:var(--white);font-size:24px;font-weight:700;letter-spacing:.05em;text-decoration:none;padding:4px 0}
.row .pz{white-space:nowrap;font-family:var(--f-head);font-size:26px;letter-spacing:.06em;color:var(--gold);text-align:right}
.row .pz.no{color:var(--muted)}
.row .st{grid-column:2/4;font-size:15px;color:var(--muted)}
.row .st.ok{color:var(--ok)}
.row button.rel{grid-column:1/4;font-size:18px;padding:8px;background:transparent;border:1px solid var(--line);color:var(--gold)}
.upd{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<a class="volver" href="admin.html">← Volver</a>
<main>
  <h1>Monitor de tickets</h1>
  <div class="stats"><div class="stat"><b id="hoy">-</b><span>Hoy</span></div><div class="stat"><b id="tot">-</b><span>Total</span></div></div>
  <button class="go" id="act" type="button">Actualizar</button>
  <div class="upd" id="upd">Cargando...</div>
  <div class="list" id="lista"></div>
</main>
<script>
let PIN="";try{PIN=localStorage.getItem("lv-pin")||""}catch(e){}
if(!PIN)location.replace("index.html");
const SB="https://fabakotfzxbwyqztrkoy.supabase.co",SBK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhYmFrb3Rmenhid3lxenRya295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDI4MzMsImV4cCI6MjEwNzg3ODgzM30.Zdr8kOdavJeyNQmBHILH0Q2i9oH2Y6OgUlKJPPkmWyw";
const PR={"5":"5%","10":"10%","15":"15%","25":"25%","JP":"Corte gratis","NO":"Sin premio","EX":"Intento extra","XTRA":"Intento extra"};
const fmt=d=>new Date(d).toLocaleString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).replace(", "," ");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let busy=false;
async function cargar(){if(busy)return;busy=true;
  try{const r=await fetch(SB+"/rest/v1/rpc/staff_recent_tickets",{method:"POST",headers:{apikey:SBK,Authorization:"Bearer "+SBK,"Content-Type":"application/json"},body:JSON.stringify({p_pin:PIN,p_limit:100})});
    const j=await r.json();
    if(!r.ok||j.error){if(j.error==="clave_incorrecta"){try{localStorage.removeItem("lv-pin")}catch(e){}location.replace("index.html");return}throw new Error(j.error||"error")}
    document.getElementById("hoy").textContent=j.today;document.getElementById("tot").textContent=j.total;
    document.getElementById("lista").innerHTML=j.tickets.map(t=>{const p=PR[t.prize]||t.prize,no=t.prize==="NO"||t.prize==="EX"||t.prize==="XTRA",ph=String(t.phone).replace(/\D/g,"");
      return '<div class="row"><span class="t">'+fmt(t.created_at)+'</span><a class="ph" href="https://wa.me/54'+ph+'" target="_blank" rel="noopener">'+esc(t.phone)+'</a><span class="pz'+(no?' no':'')+'">'+esc(p)+'</span><span class="st'+(t.redeemed_at?' ok':'')+'">'+(t.redeemed_at?'✓ Canjeado '+fmt(t.redeemed_at):(no?'—':'Sin canjear'))+'</span>'+(t.redeemed_at?'<button class="rel" type="button" data-code="'+esc(t.code)+'">Dar nuevo ticket a este celular</button>':'')+'</div>'}).join("")||'<p>Todavía no hay tickets.</p>';
    document.getElementById("upd").textContent="Actualizado "+new Date().toLocaleTimeString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour12:false})+" · se actualiza solo cada 15 s";
  }catch(e){document.getElementById("upd").textContent="No se pudo actualizar ("+e.message+"). Reintentando..."}
  busy=false}
document.getElementById("lista").onclick=async ev=>{const b=ev.target.closest("button.rel");if(!b)return;
  if(!confirm("¿Liberar el celular? El cliente va a poder sacar un ticket nuevo."))return;b.disabled=true;
  try{const r=await fetch(SB+"/rest/v1/rpc/staff_release_phone",{method:"POST",headers:{apikey:SBK,Authorization:"Bearer "+SBK,"Content-Type":"application/json"},body:JSON.stringify({p_code:b.dataset.code,p_pin:PIN})});
    const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||j.message||"error");
    busy=false;cargar()}catch(e){b.disabled=false;alert("No se pudo liberar: "+e.message)}};
document.getElementById("act").onclick=cargar;
cargar();setInterval(cargar,15000);
</script>
</body>
</html>
