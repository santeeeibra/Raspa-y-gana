function gTone(at,f,d,w,v,f2){if(!gac)return;const o=gac.createOscillator(),gn=gac.createGain();if(gw[w])o.setPeriodicWave(gw[w]);else o.type=w;o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+d);gn.gain.setValueAtTime(v,at);gn.gain.exponentialRampToValueAtTime(.0005,at+d);o.connect(gn);gn.connect(gout);o.start(at);o.stop(at+d+.02)}
function gNoise(at,d,v,hp){if(!gac)return;const s=gac.createBufferSource(),f=gac.createBiquadFilter(),gn=gac.createGain();s.buffer=gw.nb;f.type='highpass';f.frequency.value=hp;gn.gain.setValueAtTime(v,at);gn.gain.exponentialRampToValueAtTime(.0005,at+d);s.connect(f);f.connect(gn);gn.connect(gout);s.start(at);s.stop(at+d+.02)}
const mf2=m=>440*Math.pow(2,(m-69)/12),GCH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],GRT=[48,45,41,43],GAR=[0,1,2,1,0,1,2,1];
function gAudio(){gac=new(window.AudioContext||window.webkitAudioContext)();gout=gac.createGain();gout.gain.value=.35;gout.connect(gac.destination);
 const pulse=d=>{const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++)re[i]=2/(i*Math.PI)*Math.sin(Math.PI*i*d);return gac.createPeriodicWave(re,im)};gw.p25=pulse(.25);gw.p12=pulse(.125);
 const nb=gac.createBuffer(1,gac.sampleRate,gac.sampleRate),nd=nb.getChannelData(0);let sd=1;for(let i=0;i<nd.length;i++){sd=(sd*16807)%2147483647;nd[i]=sd/1073741823.5-1}gw.nb=nb;
 unlockAudio(gac);gNext=gac.currentTime+.1;gStep=0;clearInterval(gTimer);gTimer=setInterval(gMusic,100)}
function gMusic(){if(!gac)return;while(gNext<gac.currentTime+.4){const i=gStep++,bar=Math.floor(i/8)%4,st=i%8,tr=[0,2,3,5][G?G.L:0];

 if(k==='snip'){gNoise(n,.05,.22,5000);gTone(n,1800,.03,'square',.025)}

 G.queue.forEach((c,i)=>{c.tx=dx+(L===3?16:10)+i*9;c.qx+=(c.tx-c.qx)*Math.min(1,dt*4)});
 for(let i=0;i<n;i++)if(!G.seats[i]&&G.queue.length){const c=G.queue.shift();c.path=[[c.qx,SW],[dx+3,SW],[dx-3,F],[cxs[i]+2,F]];c.len=plen(c.path);c.d=0;c.st='in';G.seats[i]=c;G.walk.push(c)}
 for(const c of G.walk){c.d+=lv.V*(c.st==='out'?1.3:1)*dt;if(c.st==='in'&&c.d>=c.len){c.st='sit';c.prog=0;c.wait=0}}
 G.walk=G.walk.filter(c=>c.st==='in'||(c.st==='out'&&c.d<c.len));
 for(let i=0;i<n;i++){const c=G.seats[i];if(!c||c.st!=='sit')continue;const hero=i===n-1;
  if(!hero){c.prog+=dt/(lv.cut*2.2);if(c.prog>=1)gFinish(c,i,0)}else{c.wait+=dt;if(c.wait>PAT[L])gLeave(c,i,1)}}
 if(t>G.nextCar){G.nextCar=t+2.5+hs(t)*3;G.cars.push({t0:t,type:L===3?(hs(t+2)>.5?'limo':'taxi'):(hs(t+2)>.5?'sedan':'taxi'),col:['#2e6bd8','#2e8b57','#f4f4f4','#7a2e0e'][Math.floor(hs(t+3)*4)]})}

 if(L===3&&G.m>=GWIN){G.won=t;sfx('win')}}

 const back=G.seats.filter(c=>c&&c.st!=='out');G.queue=back.concat(G.queue).slice(0,6);G.walk=[];G.seats=[];G.m-=GCOST[G.L+1];G.L++;G.upT=G.t;G.tut=0;sfx('up')}
function gSlot(){if(G.t<G.slotCD)return;G.slotCD=G.t+5;const r=Math.random(),p=r<.15?7777:r<.5?300:50,lv=LV[3];G.m+=p;G.pops.push({t:G.t,x:lv.x1-14,s:'+$'+fmt(p),c:'#ffd23f'});if(p===7777){G.jpShow=G.t+2.2;sfx('jp')}else sfx('coin')}
function gTap(lx,ly){if(!G||G.won)return;const t=G.t;
 if(BTN&&lx>=BTN.x-2&&lx<=BTN.x+BTN.w+2&&ly>=BTN.y-3&&ly<=BTN.y+BTN.h+3){gUpgrade();return}
 if(t-G.upT<2.4)return;G.tut=0;const[lv]=gLv();
 if(G.L===3&&lx>=lv.x1-22&&lx<=lv.x1-4&&ly>=F-24&&ly<=F+2){gSlot();return}
 const c=G.seats[lv.n-1];G.tapT=t;if(c&&c.st==='sit'){c.prog+=1/TAPS[G.L];sfx('snip');if(c.prog>=1)gFinish(c,lv.n-1,1)}}
function gworld(){const t=G.t,u=t-G.upT,up=u<2.4,L=G.L;let D=L,lv=LV[L],x0=lv.x0,x1=lv.x1,n=lv.n;

 const sv=JP_T;WD=D;TOWK=D===3?(up?ease(clamp((u-1.35)/1.1,0,1)):1):0;curT=t;JP_T=G.jpShow>t?0:1e9;
 sky(D,t);if(D===3){searchlights(t);fwDraw(t,G.fw)}skyline(D,t);street(D,t,x1);
 const cxs=building(x0,x1,D,t,n,true);
 for(let i=0;i<n;i++){const hero=i===n-1,lk0=hero?HERO:EMP[i%3],lk=D===3?tuxOf(lk0):lk0,c=!up&&G.seats[i]&&G.seats[i].st==='sit'?G.seats[i]:null;
  if(c)seated(cxs[i],c.lk,Math.min(c.prog,.99),t);barber(cxs[i],lk,!!c&&(!hero||t-G.tapT<.3),t)}
 exterior(x0,x1,D,t,true);queue(x1,D,t,G.queue);
 for(const c of G.walk){const[px,py,dir]=along(c.path,c.d),ok=c.st==='out'&&!c.mad;person(px,py,c.lk,{dir,walk:t,style:ok?'fade':undefined,a:ok?0:1,spark:ok?t:null});if(c.mad&&Math.floor(t*6)%2)txt('!',px-1,py-26,'#ff3b3b',1,'#000')}

 if(!up){const hc=G.seats[n-1];if(hc&&hc.st==='sit'){const cx=cxs[n-1],k=1-clamp(hc.wait/PAT[L],0,1);R(cx-9,F-26,18,6,'rgba(0,0,0,.75)');R(cx-8,F-25,16*k,2,k>.5?'#7CFC00':k>.25?'#ffd23f':'#ff3b3b');R(cx-8,F-22,16*clamp(hc.prog,0,1),1,'#39e6ff');
   if(t-G.tapT>.5&&Math.floor(t*4)%2)txtC('TOCA!',cx,F-33,'#fff',1,'#e1281f')}}

 if(up)upgradeFx({L,k:'up'},u,t,x0,x1,GCOST[L]);JP_T=sv}
function ghud(){const t=G.t,up=t-G.upT<2.4;R(0,0,W,10,'#000');R(0,10,W,1,'#2a2a2a');coin(2,2,t);txt('$'+fmt(G.m),9,3,'#7CFC00');txtC('CLIENTES '+G.served,W/2,3,'#fff');txt('NIVEL '+(G.L+1),W-3-tw('NIVEL '+(G.L+1)),3,'#ffd23f');

 if(up)return;
